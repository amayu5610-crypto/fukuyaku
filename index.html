<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服薬確認 | 記録・照合</title>
<!-- QR解析ライブラリ。片方の配信元につながらない場合のために2か所から読み込む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>window.qrLibraryReady = typeof window.jsQR === 'function';</script>
<script>if (!window.qrLibraryReady) {document.write('<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"><\/script>')}</script>
<style>
/* ---------- Base ---------- */
:root {
  --page: #f5f6f3;
  --paper: #ffffff;
  --ink: #26332f;
  --muted: #64726c;
  --line: #d9e0db;
  --main: #286a5d;
  --main-dark: #1b5147;
  --main-soft: #eaf3ef;
  --danger: #a33d36;
  --danger-soft: #fff3f1;
  --warning-soft: #fcf7ed;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--page);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
  letter-spacing: .01em;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #8dbaa8; outline-offset: 2px; }
button:disabled { opacity: .46; cursor: not-allowed; }

/* ---------- Header / progress ---------- */
header {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: auto;
  padding: 21px 24px 17px;
  max-width: 760px;
}
.brand { display: flex; flex-direction: column; line-height: 1.25; gap: 2px; }
.brand-label { color: var(--main); font-weight: 700; font-size: 11px; letter-spacing: .15em; }
.brand-name { font-size: 24px; font-weight: 750; letter-spacing: .035em; }
#who { font-size: 14px; font-weight: 600; color: var(--muted); text-align: right; }
.steps {
  display: flex;
  gap: 0;
  max-width: 712px;
  margin: 0 auto;
  padding: 0 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.steps::-webkit-scrollbar { display: none; }
.steps span {
  position: relative;
  flex: 1 0 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 13px 2px 12px;
  border-bottom: 3px solid transparent;
  color: #7b8881;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.steps span::before {
  content: attr(data-number);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  flex: 0 0 20px;
  border: 1px solid #c9d2cc;
  border-radius: 50%;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: #748079;
}
.steps span.on { color: var(--main-dark); border-color: var(--main); }
.steps span.on::before { color: #fff; background: var(--main); border-color: var(--main); }
.steps span.done { color: #546c5e; }
.steps span.done::before { color: var(--main); border-color: var(--main); }
.steps span.history-step { flex: 0 0 auto; padding-left: 10px; padding-right: 10px; }
.steps span.history-step::before { display: none; }

/* ---------- Content ---------- */
main { margin: 0 auto; max-width: 712px; padding: 27px 22px 68px; }
h2 { font-size: clamp(24px, 5vw, 29px); font-weight: 750; line-height: 1.4; letter-spacing: -.035em; margin: 0 0 10px; }
h3 { font-size: 17px; margin: 0 0 13px; font-weight: 700; }
p { margin: 9px 0 14px; }
.lead { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 0 22px; }
.section-label { display: block; margin: 0 0 8px; color: var(--main); font-size: 12px; font-weight: 750; letter-spacing: .1em; }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px 22px;
  margin-bottom: 15px;
}
.card > b:first-child { font-weight: 700; }
.card .hint:last-child { margin-bottom: 0; }
.hint { color: var(--muted); font-size: 14px; line-height: 1.65; }
.big { font-size: 27px; font-weight: 750; line-height: 1.45; letter-spacing: -.02em; }
.detail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px 19px; }
.detail-item { display: inline-flex; align-items: baseline; gap: 8px; }
.detail-item small { font-size: 13px; color: var(--muted); }
.detail-item b { font-size: 17px; }

/* ---------- Buttons / form controls ---------- */
button, .btn {
  display: block;
  width: 100%;
  min-height: 54px;
  background: var(--paper);
  border: 1px solid #c9d4cd;
  border-radius: 9px;
  color: var(--ink);
  text-align: center;
  padding: 13px 19px;
  margin: 10px 0;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.45;
  transition: background .12s, border-color .12s;
}
button:not(:disabled):active { background: #edf2ee; }
button.pri, button.ok {
  background: var(--main);
  color: #fff;
  border-color: var(--main);
}
button.pri:not(:disabled):active, button.ok:not(:disabled):active { background: var(--main-dark); }
button.ng { color: var(--danger); border-color: #e4b7b2; background: #fff; }
button.ng:not(:disabled):active { background: var(--danger-soft); }
button.sel { border-color: var(--main); background: var(--main-soft); color: var(--main-dark); box-shadow: inset 0 0 0 1px var(--main); }
button.sel.pri { color: #fff; background: var(--main); }
button.staff-choice, button.rc {
  display: flex; align-items: center; justify-content: space-between;
  text-align: left; padding: 18px 20px; min-height: 72px; margin: 0 0 9px;
}
button.staff-choice::after, button.rc::after {
  content: ''; display: block; width: 8px; height: 8px;
  border-top: 2px solid #778b81; border-right: 2px solid #778b81;
  transform: rotate(45deg); flex-shrink: 0; margin-left: 14px;
}
/* 職員欄：タップすると直下に一覧を展開 */
.staff-field { margin: 0 0 22px; }
.staff-field-label { display: block; font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 9px; }
button.staff-dropdown-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  min-height: 64px; margin: 0; padding: 14px 17px;
  border: 1px solid #b8c7be; background: #fff; text-align: left;
  font-size: 17px; font-weight: 600; color: var(--muted);
}
button.staff-dropdown-toggle.has-value { color: var(--ink); }
button.staff-dropdown-toggle[aria-expanded="true"] {
  border-color: var(--main); border-radius: 9px 9px 0 0;
  box-shadow: inset 0 0 0 1px var(--main);
}
.staff-chevron {
  display: block; flex: 0 0 10px; width: 10px; height: 10px;
  border-right: 2px solid var(--main); border-bottom: 2px solid var(--main);
  transform: rotate(45deg); transition: transform .15s ease;
  margin-right: 4px; margin-top: -5px;
}
button.staff-dropdown-toggle[aria-expanded="true"] .staff-chevron { transform: rotate(225deg); margin-top: 5px; }
.staff-dropdown-list {
  display: grid; background: #fff; border: 1px solid var(--main); border-top: none;
  border-radius: 0 0 9px 9px; overflow: hidden;
}
.staff-dropdown-list[hidden] { display: none; }
button.staff-option {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0; padding: 13px 18px; min-height: 58px; border: 0;
  border-bottom: 1px solid var(--line); border-radius: 0;
  text-align: left; background: #fff; font-size: 17px; font-weight: 600;
}
button.staff-option:last-child { border-bottom: none; }
button.staff-option.selected { background: var(--main-soft); color: var(--main-dark); }
button.staff-option small { color: var(--main); font-size: 12px; font-weight: 650; }
button.staff-option:not(:disabled):active { background: var(--main-soft); }
button.rc { justify-content: flex-start; gap: 14px; }
button.rc::after { margin-left: auto; }
.rc img { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 8px; border: 1px solid var(--line); object-fit: cover; }
.rc .resident-name { font-size: 19px; font-weight: 750; display: block; }
.rc .resident-info { font-size: 13px; font-weight: 500; color: var(--muted); display: block; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 12px 0 10px; }
.grid button { margin: 0; min-height: 56px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
#back:not(.ng) { background: transparent; border: 0; color: var(--muted); text-align: left; font-size: 14px; padding: 10px 0; margin-top: 18px; min-height: 42px; width: auto; }
#hist, #n3 { margin-top: 17px; background: transparent; border-color: var(--line); font-size: 15px; }
#stop { background: transparent; border-color: var(--line); color: var(--muted); font-size: 15px; }
#rst { border: 1px solid #e7c4c1; background: #fff; color: var(--danger); font-size: 15px; }
input, select, textarea {
  display: block; width: 100%; min-height: 51px; background: #fff;
  border: 1px solid #bdcac2; border-radius: 8px; padding: 11px 13px;
  color: var(--ink); font-size: 16px;
}
input::placeholder, textarea::placeholder { color: #84928a; }
input + button, textarea + button { margin-top: 12px; }
select { cursor: pointer; }
textarea { resize: vertical; min-height: 100px; }
label.ack { display: flex; align-items: center; gap: 12px; padding: 14px 0 4px; font-weight: 700; font-size: 15px; }
label.ack input { width: 21px; height: 21px; min-height: 0; flex-shrink: 0; accent-color: var(--main); }
.photo { width: 132px; height: 132px; border-radius: 9px; object-fit: cover; border: 1px solid var(--line); margin-bottom: 8px; }
.person-card { text-align: center; padding: 29px 20px; }
.person-card .person-room { display: inline-block; margin-top: 14px; padding: 4px 15px; border-radius: 5px; background: var(--page); color: var(--muted); font-weight: 700; font-size: 14px; }

/* ---------- QR / status ---------- */
.qrguide {
  background: var(--warning-soft);
  border: 1px solid #eee1c8;
  border-left: 3px solid #c9a367;
  border-radius: 7px;
  padding: 13px 16px;
  font-size: 14px;
  line-height: 1.7;
  margin: 14px 0 19px;
}
.qrguide b { color: #5f4c2c; }
#cam { padding: 5px 0 12px; }
#cam video, video { width: 100%; max-height: 56vh; display: block; object-fit: contain; background: #14211f; border-radius: 10px; }
#qrphoto { font-size: 14px; padding: 10px; min-height: 53px; }
.err { background: var(--danger-soft); border-left: 4px solid var(--danger); color: #832f2c; border-radius: 5px; padding: 12px 15px; margin: 14px 0; font-size: 15px; font-weight: 650; line-height: 1.7; overflow-wrap: anywhere; }
.res { text-align: left; padding: 23px 23px 24px; border: 1px solid var(--line); border-left: 5px solid var(--main); background: #fff; border-radius: 9px; margin: 0 0 18px; }
.res.ok { border-left-color: var(--main); }
.res.ng { border-left-color: var(--danger); background: var(--danger-soft); border-top-color: #f0d6d3; border-right-color: #f0d6d3; border-bottom-color: #f0d6d3; }
.res .result-label { font-size: 13px; font-weight: 750; color: var(--main); margin-bottom: 5px; }
.res.ng .result-label { color: var(--danger); }
.res .big { font-size: 27px; }
.res .result-note { font-size: 15px; color: var(--muted); margin-top: 2px; }
.res.ng .result-note { color: #89463e; }
.chk { padding: 0; margin: 0; list-style: none; }
.chk li { display: flex; align-items: flex-start; gap: 12px; padding: 14px 2px; font-size: 15px; font-weight: 600; border-bottom: 1px solid #e4e9e5; }
.chk li:first-child { padding-top: 3px; }
.chk li:last-child { border: 0; padding-bottom: 3px; }
.chk li::before { content: '確認'; background: var(--main-soft); color: var(--main-dark); padding: 2px 7px; font-size: 11px; font-weight: 750; border-radius: 4px; flex: 0 0 auto; }
.chk li.f::before { content: '注意'; color: var(--danger); background: #fbe6e3; }
.chk li.f { color: #8f3630; }
.warnbox { background: var(--danger-soft); color: #86332d; border: 1px solid #edccc7; border-left: 4px solid var(--danger); border-radius: 7px; padding: 15px 18px; font-weight: 700; font-size: 16px; margin-bottom: 15px; }
.status-choice.sel.ok { background: var(--main-soft); color: var(--main-dark); border-color: var(--main); }
.status-choice.sel.ng { background: var(--danger-soft); color: #8f3630; border-color: var(--danger); }
.ov { position: fixed; inset: 0; background: rgb(19 34 30 / 57%); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 20; }
.ov .card { width: 100%; max-width: 440px; margin: 0; box-shadow: 0 18px 60px rgb(0 0 0 / 13%); }

/* ---------- Status overview ---------- */
.status-toolbar { display: grid; gap: 17px; }
.status-date-label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.status-date-field { max-width: 235px; }
.status-tabs { display: flex; flex-wrap: wrap; gap: 7px; }
.status-tabs button {
  flex: 1 1 90px; min-height: 43px; margin: 0; padding: 9px 8px;
  font-size: 14px; font-weight: 700; border-radius: 7px;
}
.status-tabs button.active { background: var(--main); color: #fff; border-color: var(--main); }
.status-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.status-summary-item { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 15px 12px; min-width: 0; }
.status-summary-item .status-count { display: block; font-size: 30px; line-height: 1.3; font-weight: 750; font-variant-numeric: tabular-nums; }
.status-summary-item .status-count small { font-size: 12px; font-weight: 650; margin-left: 2px; }
.status-summary-item .status-heading { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 3px; }
.status-summary-item.completed .status-count { color: var(--main-dark); }
.status-summary-item.alert .status-count { color: var(--danger); }
.status-note { font-size: 13px; color: var(--muted); line-height: 1.7; margin: 6px 0 19px; }
.status-group { padding: 0; overflow: hidden; }
.status-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; background: #f7f9f7; padding: 14px 19px; border-bottom: 1px solid var(--line); }
.status-group-head h3 { margin: 0; font-size: 17px; }
.status-group-head small { color: var(--muted); font-size: 12px; font-weight: 650; }
.status-entry { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
.status-entry:last-child { border-bottom: 0; }
.status-person { font-size: 16px; font-weight: 750; line-height: 1.4; }
.status-room { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 8px; }
.status-med { font-size: 14px; line-height: 1.5; margin-top: 6px; }
.status-detail { color: var(--muted); font-size: 12px; margin-top: 4px; }
.status-result { display: flex; align-items: flex-end; flex-direction: column; gap: 5px; flex: 0 0 auto; }
.status-pill { white-space: nowrap; border-radius: 5px; padding: 5px 10px; font-size: 12px; font-weight: 750; }
.status-pill.done { background: var(--main-soft); color: var(--main-dark); }
.status-pill.pending { background: #eff1f0; color: #56635c; }
.status-pill.attention { background: #fbe7e4; color: var(--danger); }
.status-record-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.status-empty { background: #fff; border: 1px dashed #bdcac2; border-radius: 10px; padding: 26px 20px; text-align: center; color: var(--muted); font-size: 15px; }
/* ---------- Log ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; background: #fff; margin-bottom: 17px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 570px; }
th { color: var(--muted); font-size: 12px; font-weight: 750; background: #f4f7f4; }
th, td { border-bottom: 1px solid var(--line); padding: 12px 13px; text-align: left; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.bad { color: var(--danger); background: var(--danger-soft); }
tr.bad td { font-weight: 650; }
.history-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.history-tools label { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-bottom: 6px; }

@media (max-width: 480px) {
  body { font-size: 16px; }
  .header-inner { padding: 18px 17px 14px; }
  .brand-name { font-size: 22px; }
  #who { font-size: 12px; }
  .steps { padding: 0 6px; }
  .steps span { flex-direction: column; gap: 3px; font-size: 11px; padding: 9px 0 8px; }
  .steps span::before { width: 19px; height: 19px; flex-basis: 19px; }
  main { padding: 24px 16px 55px; }
  .card { padding: 17px 16px; }
  button.staff-choice, button.rc { padding: 16px; }
  .big, .res .big { font-size: 23px; }
  .row { flex-direction: column; gap: 0; }
  .history-tools { grid-template-columns: 1fr; }
  .status-summary { gap: 7px; }
  .status-summary-item { padding: 13px 9px; }
  .status-summary-item .status-count { font-size: 27px; }
  .status-summary-item .status-heading { font-size: 11px; }
  .status-entry { padding: 15px 14px; }
  .status-group-head { padding: 13px 14px; }
  .status-person { font-size: 15px; }
  .status-med { font-size: 13px; }
  .status-pill { padding: 5px 8px; }

}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand"><span class="brand-label">服薬管理</span><span class="brand-name">服薬確認</span></div>
    <div id="who" aria-live="polite"></div>
  </div>
  <nav class="steps" id="steps" aria-label="服薬確認の進行状況"></nav>
</header>
<main id="app"></main>
<script>
/* ===== ユーティリティ ===== */
const $=s=>document.querySelector(s);
const SLOTS=['朝','昼','夕','就寝前'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=iso=>{const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
function currentSlot(){const h=new Date().getHours();return h>=5&&h<11?'朝':h>=11&&h<15?'昼':h>=15&&h<20?'夕':'就寝前'}
function avatar(ch,c){return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="${c}"/><text x="100" y="135" font-size="110" text-anchor="middle" fill="#fff" font-family="sans-serif">${ch}</text></svg>`)}

/* ===== repository層（サーバーDB移行時はここだけ差し替え） ===== */
const DB_KEY='medcheck_db_v1',LOG_KEY='medcheck_logs_v1';
function seed(){
  return {
    staff:[{id:'S001',name:'有馬　裕美'},{id:'S002',name:'大西　あす香'},{id:'S002',name:'佐藤　和也'},{id:'S002',name:'田中　優花'},{id:'S002',name:'吉川　智里'},{id:'S002',name:'細川　誠'},{id:'S002',name:'端田　照夫'}
          ,{id:'S002',name:'吉田　昇眞'},{id:'S002',name:'瀬口　千尋'},{id:'S002',name:'彦坂　圭祐'},{id:'S002',name:'千葉　殊美'},{id:'S002',name:'田邉　光子'},{id:'S002',name:'稲田　美和'},{id:'S002',name:'青木　桜介'}],
    residents:[
      {id:'R001',name:'佐藤 花子',kana:'さとう はなこ',photo:avatar('佐','#c2185b'),room:'101'},
      {id:'R002',name:'鈴木 一郎',kana:'すずき いちろう',photo:avatar('鈴','#1565c0'),room:'102'},
      {id:'R003',name:'田中 みどり',kana:'たなか みどり',photo:avatar('田','#2e7d32'),room:'103'}],
    medicines:[
      {id:'M001',name:'アムロジピン錠5mg',shape:'白い丸い錠剤',note:'血圧の薬。グレープフルーツ不可'},
      {id:'M002',name:'メトホルミン錠250mg',shape:'白い錠剤',note:'食直後に服用'},
      {id:'M003',name:'ワーファリン錠1mg',shape:'白い小さな錠剤',note:'出血に注意。納豆禁止'},
      {id:'M004',name:'マグミット錠330mg',shape:'白い大きな錠剤',note:'水を多めに'},
      {id:'M005',name:'ガスター錠20mg',shape:'薄い黄色の錠剤',note:'胃の薬'}],
    prescriptions:[
      {id:'P001',residentId:'R001',medicineId:'M001',dose:'1錠',timeSlot:'朝',startDate:addDays(-30),endDate:addDays(365)},
      {id:'P002',residentId:'R001',medicineId:'M002',dose:'1錠',timeSlot:'夕',startDate:addDays(-30),endDate:addDays(365)},
      {id:'P003',residentId:'R002',medicineId:'M003',dose:'1錠',timeSlot:'朝',startDate:addDays(-30),endDate:addDays(365)},

function msg(t){const el=$('#msg');if(el)el.innerHTML=t?`<div class="err">${t}</div>`:''}

async function startScan(){
  if(starting||stream)return;
  if(!hasDecoder()){
    msg('QRを認識する部品がありません。インターネット接続を確認して再読み込みするか、手入力をお使いください。');return;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    msg('カメラが使えません。HTTPSで公開したページをSafari／Chromeで開いてください。HTMLファイルを直接開いた場合も、端末によっては動作しません。');return;
  }
  starting=true;
  const session=++scanSession;
  msg('カメラへの接続を確認しています。');
  let opened=null;
  try{
    try{
      opened=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    }catch(e){
      // カメラの条件が厳しすぎる端末では条件を緩めて再試行
      if(e.name!=='OverconstrainedError' && e.name!=='NotFoundError')throw e;
      opened=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    }
    if(session!==scanSession || !$('#video')){opened.getTracks().forEach(t=>t.stop());return}
    stream=opened;
    $('#cam').style.display='block';$('#start').style.display='none';
    const v=$('#video');v.srcObject=stream;
    await v.play();
    if(session!==scanSession)return;
    msg('カメラを起動しました。QRコードを映してください。');
    lastScan=0;loop(session);
  }catch(e){
    if(opened){opened.getTracks().forEach(t=>t.stop());if(stream===opened)stream=null}
    if(session!==scanSession)return;
    if($('#cam'))$('#cam').style.display='none';
    if($('#start'))$('#start').style.display='';
    if(e.name==='NotAllowedError'||e.name==='SecurityError')
      msg('カメラが許可されていません。Safari／Chromeのサイト設定でカメラを許可してから、再度押してください。HTTPSでのアクセスも確認してください。');
    else if(e.name==='NotReadableError')
      msg('カメラが別のアプリで使用中の可能性があります。ほかのカメラアプリを閉じて再試行してください。');
    else if(e.name==='NotFoundError')msg('カメラが見つかりません。写真または手入力をお使いください。');
    else msg('カメラを起動できません（'+esc(e.name||'unknown')+'）。写真または手入力をお使いください。');
  }finally{starting=false}
}

async function decodeQR(source,cv){
  // BarcodeDetectorが失敗しても、jsQRに必ずフォールバックする
  if(bd){
    try{
      const results=await bd.detect(source);
      if(results?.length && results[0].rawValue)return results[0].rawValue;
    }catch(e){bd=null;console.warn('BarcodeDetector を無効化し jsQR に切り替えます',e)}
  }
  if(typeof window.jsQR!=='function')return null;
  const w=source.videoWidth || source.naturalWidth || source.width;
  const h=source.videoHeight || source.naturalHeight || source.height;
  if(!w||!h)return null;
  const scale=Math.min(1,1600/Math.max(w,h));
  cv.width=Math.max(1,Math.round(w*scale));cv.height=Math.max(1,Math.round(h*scale));
  const c=cv.getContext('2d',{willReadFrequently:true});
  if(!c)return null;
  c.drawImage(source,0,0,cv.width,cv.height);
  const pix=c.getImageData(0,0,cv.width,cv.height);
  const qr=window.jsQR(pix.data,pix.width,pix.height,{inversionAttempts:'attemptBoth'});
  return qr?.data||null;
}

function loop(session){
  if(session!==scanSession || !stream || !$('#video'))return;
  const v=$('#video'),cv=$('#cv');
  const now=performance.now();
  if(!busy && now-lastScan>=140 && v.readyState>=v.HAVE_CURRENT_DATA && v.videoWidth){
    busy=true;lastScan=now;
    (async()=>{
      try{
        const data=await decodeQR(v,cv);
        if(data && session===scanSession && stream){stopScan();onCode(data)}
      }catch(e){console.warn('QR画像解析に失敗',e)}
      finally{busy=false}
    })();
  }
  raf=requestAnimationFrame(()=>loop(session));
}

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};
    im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像形式を読み込めません'))};
    im.src=url;
  });
}
async function photoScan(e){
  const file=e.target.files?.[0];if(!file)return;
  if(!hasDecoder()){msg('QR読み取り部品がありません。通信を確認するか手入力してください。');return}
  stopScan();
  $('#cam').style.display='none';$('#start').style.display='';
  msg('写真のQRコードを確認しています。');
  try{
    const im=await loadImage(file);
    if(!$('#cv'))return;
    const data=await decodeQR(im,$('#cv'));
    if(data){onCode(data)}
    else msg('この写真からQRが見つかりませんでした。QRが大きく鮮明に写った写真を選んでください。');
  }catch(e){msg('写真を処理できませんでした（'+esc(e.message)+'）。JPEG／PNGなどをお試しください。')}
  finally{if($('#qrphoto'))$('#qrphoto').value=''}

function confirmDlg(reason){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="card"><div class="big" style="font-size:22px">この内容で保存しますか？</div>
  <p>${esc(S.resident.name)}さん／${esc(S.check.med.name)}／${esc(S.rx.timeSlot)}<br><b>結果：${esc(S.status)}</b>${reason?'<br>理由：'+esc(reason):''}</p>
  <div class="row"><button id="c">戻る</button><button class="pri" id="o">保存する</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#c').onclick=()=>d.remove();
  d.querySelector('#o').onclick=()=>{
    const res=repo.saveLog({residentId:S.resident.id,medicineId:S.rx.medicineId,prescriptionId:S.rx.id,date:ymd(new Date()),timeSlot:S.rx.timeSlot,staffId:S.staff.id,status:S.status,reason});
    d.remove();
    if(!res.ok){alert('この処方は本日この時間帯に記録済みのため、保存しませんでした。');S.check=verify(S.rx);go(4);return}
    S.saved=res.log;S.rsel=S.rfree='';renderDone();
  };
}
function renderDone(){
  const l=S.saved,a=$('#app');renderSteps();
  a.innerHTML=`<span class="section-label">記録完了</span>
  <div class="res ok"><div class="result-label">保存済み</div><div class="big">記録が完了しました</div><div class="result-note">服薬結果を保存しました。</div></div>
  <div class="card"><h3>保存した内容</h3><div class="big" style="font-size:20px">${esc(S.resident.name)} さん</div>
  <p>${esc(S.check.med.name)} / ${esc(S.rx.dose)} / ${esc(l.timeSlot)}</p>
  <div class="detail"><span class="detail-item"><small>結果</small><b>${esc(l.status)}</b></span><span class="detail-item"><small>時刻</small><b>${hm(l.createdAt)}</b></span></div>
  ${l.reason?'<p class="hint">理由：'+esc(l.reason)+'</p>':''}<p class="hint">担当：${esc(S.staff.name)}</p></div>
  <button class="pri" id="n1">同じ方の次の薬を確認する</button><button id="n2">別の利用者を確認する</button><button id="nstatus">服薬状況一覧を見る</button><button id="n3">服薬履歴を見る</button>`;
  $('#n1').onclick=()=>go(3);$('#n2').onclick=()=>go(2);$('#nstatus').onclick=showStatus;$('#n3').onclick=()=>{S.view='history';render()};
}

/* --- 服薬状況一覧 --- */
function renderStatus(a){
  const date=S.dashboardDate||ymd(new Date());
  const slot=S.dashboardSlot||'すべて';
  // 指定日に有効な処方だけを対象とする。1処方につき1件をカウント。
  const rows=repo.getPrescriptions()
    .filter(rx=>rx.startDate<=date&&date<=rx.endDate&&(slot==='すべて'||rx.timeSlot===slot))
    .map(rx=>{
      const person=repo.getResident(rx.residentId);
      const med=repo.getMedicine(rx.medicineId);
      const log=repo.findLog(rx.id,date,rx.timeSlot);
      return {rx,person,med,log,status:log?log.status:'未確認'};
    })
    .sort((a,b)=>SLOTS.indexOf(a.rx.timeSlot)-SLOTS.indexOf(b.rx.timeSlot)
       ||String(a.person?.room||'').localeCompare(String(b.person?.room||''),'ja')
       ||String(a.rx.id).localeCompare(String(b.rx.id)));
  const done=rows.filter(x=>x.status==='服薬済み').length;
  const pending=rows.filter(x=>x.status==='未確認').length;
  const attention=rows.length-done-pending;
  const label=x=>x.status==='未確認'?'未確認':x.status;
  const state=x=>x.status==='服薬済み'?'done':x.status==='未確認'?'pending':'attention';

  a.innerHTML=`<span class="section-label">服薬管理 / 一覧</span>
  <h2>服薬状況一覧</h2>
  <p class="lead">日付と時間帯を選び、処方ごとの記録状況を確認できます。</p>
  <div class="card status-toolbar">
    <div><label class="status-date-label" for="status-date">確認する日付</label>
      <input class="status-date-field" id="status-date" type="date" value="${esc(date)}"></div>
    <div><span class="status-date-label">時間帯</span>
      <div class="status-tabs" role="group" aria-label="時間帯の絞り込み">
        ${['すべて',...SLOTS].map(t=>`<button type="button" data-status-slot="${esc(t)}" class="${t===slot?'active':''}" aria-pressed="${t===slot}">${esc(t)}</button>`).join('')}
      </div>
    </div>
  </div>
  <div class="status-summary" aria-label="服薬状況の集計">
    <div class="status-summary-item completed"><span class="status-count">${done}<small>件</small></span><span class="status-heading">服薬済み</span></div>
    <div class="status-summary-item"><span class="status-count">${pending}<small>件</small></span><span class="status-heading">未確認</span></div>
    <div class="status-summary-item alert"><span class="status-count">${attention}<small>件</small></span><span class="status-heading">未服薬・拒否</span></div>
  </div>
  <p class="status-note">対象：${rows.length}件の処方。「未確認」は、この端末に記録がない状態です。実際に服薬していないことを意味しません。</p>
  ${rows.length?SLOTS.filter(t=>slot==='すべて'||t===slot).map(t=>{
    const entries=rows.filter(x=>x.rx.timeSlot===t);
    if(!entries.length)return '';
    return `<section class="card status-group" aria-label="${esc(t)}の服薬状況">
      <div class="status-group-head"><h3>${esc(t)}</h3><small>${entries.length}件</small></div>
      ${entries.map(x=>`<div class="status-entry">
        <div class="status-entry-info">
          <div class="status-person">${esc(x.person?.name||'利用者不明')}<span class="status-room">${esc(x.person?.room||'—')}号室</span></div>
          <div class="status-med">${esc(x.med?.name||'薬剤不明')} / ${esc(x.rx.dose)}</div>
          <div class="status-detail">処方番号：${esc(x.rx.id)}</div>
        </div>
        <div class="status-result"><span class="status-pill ${state(x)}">${esc(label(x))}</span>${x.log?`<span class="status-record-time">${hm(x.log.createdAt)}</span>`:''}</div>
      </div>`).join('')}
    </section>`;
  }).join(''):'<div class="status-empty">選択した日付・時間帯に有効な処方はありません。</div>'}
  <p class="hint">表示される記録は、この端末のブラウザに保存されたものだけです。他の端末とは同期されません。</p>
  <button class="pri" id="status-back">服薬確認に戻る</button>
  <button id="status-history">服薬履歴を見る</button>`;
  $('#status-date').onchange=e=>{if(e.target.value){S.dashboardDate=e.target.value;renderStatus(a)}};
  a.querySelectorAll('[data-status-slot]').forEach(b=>b.onclick=()=>{S.dashboardSlot=b.dataset.statusSlot;renderStatus(a)});
  $('#status-back').onclick=()=>go(1);
  $('#status-history').onclick=()=>{S.view='history';render()};
  window.scrollTo(0,0);
}

/* --- 履歴 --- */
function renderHistory(a){
  const fr=S.hr||'',fd=S.hd===undefined?ymd(new Date()):S.hd;
  const logs=repo.getLogs().filter(l=>(!fr||l.residentId===fr)&&(!fd||l.date===fd)).sort((x,y)=>y.createdAt.localeCompare(x.createdAt));
  a.innerHTML=`<span class="section-label">服薬記録</span><h2>服薬履歴</h2>
  <p class="lead">日付と利用者を指定して記録を確認できます。</p>
  <div class="card"><div class="history-tools">
  <div><label for="fr">利用者</label><select id="fr"><option value="">すべての利用者</option>${repo.getResidents().map(r=>`<option value="${r.id}" ${r.id===fr?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
  <div><label for="fd">日付</label><input type="date" id="fd" value="${fd}"></div>
  </div></div>
  <div class="table-wrap"><table><tr><th>時刻</th><th>利用者</th><th>薬 / 時間帯</th><th>結果</th><th>担当</th></tr>
  ${logs.map(l=>`<tr class="${l.status!=='服薬済み'?'bad':''}"><td>${hm(l.createdAt)}</td><td>${esc(repo.getResident(l.residentId)?.name)}</td><td>${esc(repo.getMedicine(l.medicineId)?.name)}<br>${esc(l.timeSlot)}</td><td>${esc(l.status)}${l.reason?'<br><small>'+esc(l.reason)+'</small>':''}</td><td>${esc(repo.getStaff(l.staffId)?.name)}</td></tr>`).join('')||'<tr><td colspan="5">該当する記録がありません。</td></tr>'}</table></div>
  <button id="csv">CSV形式で書き出す</button><button id="history-status">服薬状況一覧を見る</button><button id="rst">テストデータを初期化する</button><button id="back">確認画面に戻る</button>`;
  $('#fr').onchange=e=>{S.hr=e.target.value;renderHistory(a)};
  $('#fd').onchange=e=>{S.hd=e.target.value;renderHistory(a)};
  $('#back').onclick=()=>go(1);
  $('#history-status').onclick=showStatus;
  $('#rst').onclick=()=>{if(confirm('記録とサンプルデータを初期化します。よろしいですか？')){repo.reset();renderHistory(a)}};
  $('#csv').onclick=()=>{
    const rows=[['日付','時刻','利用者','薬','時間帯','結果','理由','職員']].concat(logs.map(l=>[l.date,hm(l.createdAt),repo.getResident(l.residentId)?.name,repo.getMedicine(l.medicineId)?.name,l.timeSlot,l.status,l.reason,repo.getStaff(l.staffId)?.name]));
    const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const u=URL.createObjectURL(new Blob([t],{type:'text/csv'}));const x=document.createElement('a');x.href=u;x.download='服薬履歴_'+fd+'.csv';x.click();
  };
}
render();
</script>
</body>
</html>
